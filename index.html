<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Дневник рефлексии RENEWAL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: a deep-navy brand band with both logos and the 12-session progress, then one column of cards on a cool near-white ground; one screen at a time. */
:root{
  --bg:#F1F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --card-edge:transparent;
  --ink:#162C41; --ink-2:#4E6072; --ink-3:#6F8194; --line:#E1E7ED;
  --band:#162C41; --band-ink:#F6F1EF; --band-ink-2:#B8C3CE; --band-ink-3:#6F8396; --band-line:#2C4359;
  --glow-a:rgba(241,213,204,.20); --glow-b:rgba(107,167,193,.24);
  --pastel-a:#F1D5CC; --pastel-b:#6BA7C1;
  --accent-a:#D28F6B; --accent-b:#2A7499; --accent:#2A7499;
  --btn-fill:#162C41; --btn-ink:#FFFFFF;
  --chip:#E6EFF4; --chip-ink:#245C78;
  --warm-chip:#F8E8E1; --warm-chip-ink:#8C4E31;
  --done:#2A7499; --on-done:#FFFFFF; --on-accent:#FFFFFF;
  --ring:rgba(42,116,153,.18);
  --shadow:0 1px 2px rgba(22,44,65,.05), 0 6px 20px rgba(22,44,65,.06);
  --toast-bg:#162C41; --toast-ink:#F6F1EF;
  --font-ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display:Georgia, "PT Serif", "Noto Serif", "Times New Roman", serif;
  --r-card:18px; --r-ctl:14px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1825; --surface:#142638; --surface-2:#182D42; --card-edge:#22384D;
    --ink:#ECF0F4; --ink-2:#A9B7C5; --ink-3:#7F91A4; --line:#22384D;
    --accent-a:#F1D5CC; --accent-b:#6BA7C1; --accent:#8DBDD2;
    --btn-fill:linear-gradient(90deg,#F1D5CC,#A9C8D6); --btn-ink:#132638;
    --chip:#1C364D; --chip-ink:#B5D5E3; --warm-chip:#3A2925; --warm-chip-ink:#F1D5CC;
    --done:#6BA7C1; --on-done:#0C1825; --on-accent:#132638;
    --ring:rgba(141,189,210,.22);
    --shadow:0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.22);
    --toast-bg:#ECF0F4; --toast-ink:#132638;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1825; --surface:#142638; --surface-2:#182D42; --card-edge:#22384D;
  --ink:#ECF0F4; --ink-2:#A9B7C5; --ink-3:#7F91A4; --line:#22384D;
  --accent-a:#F1D5CC; --accent-b:#6BA7C1; --accent:#8DBDD2;
  --btn-fill:linear-gradient(90deg,#F1D5CC,#A9C8D6); --btn-ink:#132638;
  --chip:#1C364D; --chip-ink:#B5D5E3; --warm-chip:#3A2925; --warm-chip-ink:#F1D5CC;
  --done:#6BA7C1; --on-done:#0C1825; --on-accent:#132638;
  --ring:rgba(141,189,210,.22);
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.22);
  --toast-bg:#ECF0F4; --toast-ink:#132638;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.on-home::before{background:var(--band)}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
p,h1,h2,h3,ul{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{width:100%;max-width:560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* brand band */
.band{color:var(--band-ink);background:
  radial-gradient(130% 90% at 100% 0%, var(--glow-a), transparent 55%),
  radial-gradient(110% 80% at 0% 100%, var(--glow-b), transparent 60%),
  var(--band)}
.band-inner{padding-block:18px 56px;display:flex;flex-direction:column;gap:6px}
.logos{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.logo-hse{display:block;flex:none;width:40px;height:40px}
.logo-hse svg{display:block;width:100%;height:100%}
.logo-sep{flex:none;width:1px;height:28px;background:var(--band-line)}
.logo-renewal{display:block;height:36px;width:auto}
.eyebrow{font-size:12px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
.band .eyebrow{color:var(--band-ink-2)}
.greet{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.15;text-wrap:balance}
.program{font-size:14px;color:var(--band-ink-2)}
.progress{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.progress-num{display:flex;align-items:flex-end;gap:10px}
.big{font-size:46px;line-height:.85;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.of{font-size:13px;line-height:1.3;color:var(--band-ink-2)}
.segs{display:flex;gap:7px}
.seg-group{flex:var(--k) 1 0;min-width:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px}
.seg{height:6px;border-radius:2px;background:var(--band-line)}
.seg.done{background:var(--c)}
.seg-labels{display:flex;gap:7px;margin-top:-4px}
.seg-labels span{flex:var(--k) 1 0;min-width:0;font-size:10.5px;letter-spacing:.06em;color:var(--band-ink-2);white-space:nowrap;overflow:hidden}
.seg.missed{background:transparent;box-shadow:inset 0 0 0 1px var(--band-ink-3)}
.seg.today{background:transparent;box-shadow:inset 0 0 0 1.5px var(--pastel-a);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* home column */
.home-main{margin-top:-34px;display:flex;flex-direction:column;gap:28px;padding-bottom:24px}
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow), 0 0 0 1px var(--card-edge)}
.focus{padding:20px;display:flex;flex-direction:column;gap:6px}
.focus-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow.accent{color:var(--accent)}
.chip{font-size:12px;font-weight:600;line-height:1.2;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink);white-space:nowrap}
.chip.warm{background:var(--warm-chip);color:var(--warm-chip-ink)}
.focus-title{font-family:var(--font-display);font-weight:400;font-size:23px;line-height:1.2;margin-top:6px;text-wrap:balance}
.focus-meta{color:var(--ink-2);font-size:14px}
.focus-done{display:flex;align-items:center;gap:8px;color:var(--done);font-weight:600;font-size:14px;margin-top:10px}
.focus-done svg{width:18px;height:18px}
.focus-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.focus-note{text-align:center;font-size:13px;color:var(--ink-3)}
.focus-also{margin-top:6px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);text-align:center}
.focus-also button{color:var(--accent);font-weight:600;text-align:center}

.modules{display:flex;flex-direction:column;gap:10px}
.mod{overflow:hidden}
.mod > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;-webkit-tap-highlight-color:transparent}
.mod > summary::-webkit-details-marker{display:none}
.mod > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r-card)}
.mod-num{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:16px;background:var(--chip);color:var(--chip-ink);font-variant-numeric:tabular-nums}
.mod.current .mod-num{background:var(--btn-fill);color:var(--btn-ink)}
.mod-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mod-title{font-size:15px;font-weight:600;line-height:1.3}
.mod-sub{font-size:12.5px;color:var(--ink-3)}
.chev{flex:none;width:20px;height:20px;color:var(--ink-3);transition:transform .2s ease}
.mod[open] .chev{transform:rotate(180deg)}
.mod-note{padding:10px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);background:var(--surface-2)}
.mod .archive{border-top:1px solid var(--line)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 20px;border-radius:var(--r-ctl);background:var(--btn-fill);color:var(--btn-ink);font-weight:600;font-size:16px;text-align:center;transition:transform .12s ease, opacity .12s ease}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.42;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.quiet{width:auto;flex:none;background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);padding:0 18px}

.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-inline:4px}
.section-head h2{font-size:17px;font-weight:600;line-height:1.3}
.count{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0;white-space:nowrap}
.link.block{align-self:center}
.list{list-style:none;padding:0}
.list > li{padding:14px 16px;border-top:1px solid var(--line)}
.list > li:first-child{border-top:0}
.ins{display:flex;gap:12px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:8px;background:linear-gradient(135deg,var(--accent-a),var(--accent-b))}
.ins-body{min-width:0}
.ins-text{font-size:15px;line-height:1.45}
.meta{font-size:12.5px;line-height:1.4;color:var(--ink-3);margin-top:4px}
.empty{font-size:14px;color:var(--ink-3);padding:16px}

.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left}
.box{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-3);display:grid;place-items:center;margin-top:1px;transition:background .15s ease, box-shadow .15s ease}
.box svg{width:12px;height:12px;opacity:0;transition:opacity .15s ease}
.check[aria-checked="true"] .box{background:var(--done);box-shadow:none}
.check[aria-checked="true"] .box svg{opacity:1}
.check[aria-checked="true"] .txt{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.txt{font-size:15px;line-height:1.45;min-width:0}
.check-meta{padding-left:34px}

.archive > li{padding:12px 16px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.row[disabled]{cursor:default}
.row[disabled] .row-title{color:var(--ink-2)}
.date{flex:none;width:40px;display:flex;flex-direction:column;align-items:center;line-height:1}
.date b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.date small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-top:4px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-size:15px;line-height:1.3}
.row-sub{font-size:12.5px;color:var(--ink-3)}
.pill{flex:none;font-size:11.5px;font-weight:600;line-height:1.2;padding:5px 9px;border-radius:999px;white-space:nowrap}
.pill.done{background:var(--chip);color:var(--chip-ink)}
.pill.missed{background:var(--warm-chip);color:var(--warm-chip-ink)}
.pill.today{background:var(--btn-fill);color:var(--btn-ink)}
.pill.future{color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}

.foot{display:flex;flex-direction:column;gap:6px;padding:0 4px 8px;font-size:12.5px;line-height:1.45;color:var(--ink-3)}

/* inner screens */
.screen{min-height:100vh;min-height:calc(var(--tg-viewport-stable-height, 100svh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:8px;min-height:54px}
.icon-btn{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.tg-back .back-btn{visibility:hidden}
.topbar-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;text-align:center}
.topbar-title small{font-size:12px;color:var(--ink-3)}
.topbar-title b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-side{flex:none;width:40px;text-align:right;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.flow-body{flex:1;padding-block:20px 24px;display:flex;flex-direction:column;gap:10px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:12px}
.steps span{height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:linear-gradient(90deg,var(--accent-a),var(--accent-b))}
.q{font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1.18;text-wrap:balance}
.hint{color:var(--ink-2);font-size:14.5px;margin-bottom:8px}
textarea{display:block;width:100%;min-height:180px;resize:none;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink);font:17px/1.5 var(--font-ui);padding:14px 16px;outline:none;transition:border-color .15s ease, box-shadow .15s ease}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
textarea:focus-visible{outline:none}
textarea::placeholder{color:var(--ink-3)}
.ta-foot{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--ink-3);min-height:18px;font-variant-numeric:tabular-nums}
.ta-foot .warn{color:var(--warm-chip-ink)}
.bottombar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.bottombar .wrap{display:flex;gap:10px}

.done-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding-block:32px}
.done-mark{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-a),var(--accent-b));color:var(--on-accent);margin-bottom:10px;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.done-mark svg{width:34px;height:34px}
@keyframes pop{from{transform:scale(.7);opacity:.5}}
.done-title{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.15}
.done-sub{color:var(--ink-2);font-size:15px;max-width:34ch}
.done-stats{list-style:none;padding:6px 0;margin:14px 0 6px;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.done-stats li{padding:12px 8px;display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line)}
.done-stats li:first-child{border-left:0}
.done-stats b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.done-stats span{font-size:12px;color:var(--ink-3);line-height:1.3}
.done-actions{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:8px}

.page{display:flex;flex-direction:column;gap:16px;padding-block:20px 28px}
.entry-head{display:flex;flex-direction:column;gap:6px;padding-inline:4px;align-items:flex-start}
.entry-title{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.2;text-wrap:balance}
.entry-head .meta{margin-top:0;font-size:14px;color:var(--ink-2)}
.qa{padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.qa-q{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
.qa-a{font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.bul{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.bul li{display:flex;gap:12px;font-size:15.5px;line-height:1.45}
.qa .checks{display:flex;flex-direction:column;gap:12px;list-style:none;padding:0}
.center{text-align:center}
.group{display:flex;flex-direction:column;gap:10px}
.group-head{padding-inline:4px;display:flex;flex-direction:column;gap:2px}
.group-head b{font-size:15px;font-weight:600;line-height:1.3}
.group-head small{font-size:12.5px;color:var(--ink-3)}

.state-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding-block:40px;max-width:440px}
.state-body h1{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.2;text-wrap:balance}
.state-body p{color:var(--ink-2);font-size:15px}
.state-logos{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:var(--band);margin-bottom:14px}
.note{font-size:13.5px;line-height:1.5;color:var(--ink-2);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;box-shadow:0 0 0 1px var(--line)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;background:var(--toast-bg);color:var(--toast-ink);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:20;transition:opacity .2s ease, transform .2s ease;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }
  function toLines(text) {
    return String(text || '').split('\n').map(function (l) {
      return l.replace(/^\s*(?:[-–—•*]+|\d+[.)])\s*/, '').trim();
    }).filter(Boolean);
  }

  function settings() { return (S.data && S.data.settings) || {}; }
  function sessions() { return (S.data && S.data.sessions) || []; }
  function questions() { return (S.data && S.data.questions) || []; }
  function sessionById(id) { return sessions().filter(function (s) { return s.id === id; })[0]; }
  function numberOf(s) { return s.number || (sessions().indexOf(s) + 1); }
  function maxLen() { return +settings().max_answer_length || 1200; }
  function modules() {
    var m = (S.data && S.data.modules) || [];
    if (!m.length) return [{ number: null, title: 'Все занятия', all: true }];
    var known = {};
    m.forEach(function (x) { known[x.number] = true; });
    var orphan = sessions().some(function (s) { return !known[s.module]; });
    return orphan ? m.concat([{ number: 'extra', title: 'Дополнительные встречи', extra: true, known: known }]) : m;
  }
  function sessionsOfModule(m) {
    if (m.all) return sessions();
    if (m.extra) return sessions().filter(function (s) { return !m.known[s.module]; });
    return sessions().filter(function (s) { return s.module === m.number; });
  }
  function modShort(m) { return m.final ? 'Ф' : m.extra ? '+' : 'М' + m.number; }
  function modBadge(m) { return m.final ? 'Ф' : m.extra ? '+' : m.number; }
  function modChip(m) { return m.final ? 'Финал' : 'Модуль ' + m.number; }
  function moduleOf(s) { return (S.data.modules || []).filter(function (m) { return m.number === s.module; })[0]; }
  function modeLabel(s) { return s.mode === 'offline' ? 'Очно' : s.mode === 'online' ? 'Онлайн' : (s.format || ''); }
  function metaLine(s) { return [s.speaker, modeLabel(s)].filter(Boolean).map(esc).join(' · '); }
  function periodText(a, b) {
    if (a === b) return fmtDayMonth(a);
    var da = parseISO(a), db = parseISO(b);
    if (da.getMonth() === db.getMonth() && da.getFullYear() === db.getFullYear()) return da.getDate() + '–' + fmtDayMonth(b);
    return fmtDayMonth(a) + ' – ' + fmtDayMonth(b);
  }
  function mix(a, b, t) {
    var pa = [1, 3, 5].map(function (i) { return parseInt(a.substr(i, 2), 16); });
    var pb = [1, 3, 5].map(function (i) { return parseInt(b.substr(i, 2), 16); });
    return 'rgb(' + pa.map(function (v, i) { return Math.round(v + (pb[i] - v) * t); }).join(',') + ')';
  }

  function todayISO() {
    var o = settings().today_override;
    if (o && /^\d{4}-\d{2}-\d{2}$/.test(o)) return o;
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function entryOf(id) { return S.entries[id]; }
  function hasEntry(id) {
    var e = S.entries[id];
    return !!(e && ((e.good && e.good.trim()) || (e.insights && e.insights.length) || (e.actions && e.actions.length)));
  }
  function statusOf(s) {
    var t = todayISO();
    if (hasEntry(s.id)) return 'done';
    if (s.date === t) return 'today';
    if (s.date < t) return 'missed';
    return 'future';
  }
  function studentName() {
    try { if (inTg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) return tg.initDataUnsafe.user.first_name; } catch (e) {}
    return settings().demo_mode ? (settings().demo_student_name || '') : '';
  }
  function greeting() {
    var h = new Date().getHours();
    if (h < 5) return 'Доброй ночи';
    if (h < 12) return 'Доброе утро';
    if (h < 18) return 'Добрый день';
    return 'Добрый вечер';
  }
  function focusSession() {
    var ss = sessions(), t = todayISO();
    var todays = ss.filter(function (s) { return s.date === t; });
    if (todays.length) {
      var open = todays.filter(function (s) { return !hasEntry(s.id); });
      if (open.length) return { s: open[0], kind: 'today', also: open.slice(1) };
      return { s: todays[todays.length - 1], kind: 'today-done' };
    }
    var past = ss.filter(function (s) { return s.date < t; });
    var last = past[past.length - 1];
    if (last && !hasEntry(last.id)) return { s: last, kind: 'missed' };
    var next = ss.filter(function (s) { return s.date > t; })[0];
    if (next) return { s: next, kind: 'next' };
    return { s: last, kind: 'finished' };
  }
  function allInsights() {
    var out = [];
    sessions().slice().reverse().forEach(function (s) {
      if (!hasEntry(s.id)) return;
      (entryOf(s.id).insights || []).forEach(function (t) { out.push({ text: t, s: s }); });
    });
    return out;
  }
  function allActions() {
    var out = [];
    sessions().slice().reverse().forEach(function (s) {
      if (!hasEntry(s.id)) return;
      (entryOf(s.id).actions || []).forEach(function (a, i) { out.push({ a: a, s: s, i: i }); });
    });
    return out;
  }
  function doneCount() { return sessions().filter(function (s) { return hasEntry(s.id); }).length; }

  /* ---------- shared fragments ---------- */
  function logos() {
    return '<span class="logo-hse" role="img" aria-label="НИУ ВШЭ">' + HSE_SVG + '</span>' +
      '<span class="logo-sep" aria-hidden="true"></span>' +
      '<img class="logo-renewal" src="' + RENEWAL_SRC + '" alt="RENEWAL academy">';
  }
  function topbar(small, title, side) {
    return '<header class="topbar"><div class="wrap topbar-in">' +
      '<button class="icon-btn back-btn" data-act="back" aria-label="Назад">' + ICON.back + '</button>' +
      '<div class="topbar-title">' + (small ? '<small>' + esc(small) + '</small>' : '') + '<b>' + esc(title) + '</b></div>' +
      '<span class="topbar-side">' + (side || '') + '</span>' +
      '</div></header>';
  }
  function checkItem(s, a, i, withMeta) {
    return '<li>' +
      '<button class="check" role="checkbox" aria-checked="' + (a.done ? 'true' : 'false') + '" data-act="toggle" data-id="' + esc(s.id) + '" data-idx="' + i + '">' +
      '<span class="box">' + ICON.checkSmall + '</span><span class="txt">' + esc(a.text) + '</span></button>' +
      (withMeta ? '<p class="meta check-meta">Занятие ' + numberOf(s) + ' · ' + esc(s.title) + '</p>' : '') +
      '</li>';
  }
  function insightItem(it, withMeta) {
    return '<li class="ins"><span class="dot" aria-hidden="true"></span><div class="ins-body">' +
      '<p class="ins-text">' + esc(it.text) + '</p>' +
      (withMeta ? '<p class="meta">Занятие ' + numberOf(it.s) + ' · ' + esc(it.s.title) + '</p>' : '') +
      '</div></li>';
  }

  /* ---------- screens ---------- */
  function renderHome() {
    var ss = sessions(), n = ss.length, dc = doneCount(), name = studentName();
    var p = S.data.program || {};

    var mods = modules().filter(function (m) { return sessionsOfModule(m).length; });
    var segs = mods.map(function (m) {
      var ms = sessionsOfModule(m);
      return '<span class="seg-group" style="--k:' + ms.length + '">' + ms.map(function (s) {
        var st = statusOf(s), i = ss.indexOf(s);
        var label = { done: 'записано', today: 'сегодня', missed: 'без записи', future: 'впереди' }[st];
        var c = mix('#F1D5CC', '#6BA7C1', n > 1 ? i / (n - 1) : 0);
        return '<span class="seg ' + st + '" style="--c:' + c + '" title="Занятие ' + numberOf(s) + ' · ' + fmtDayMonth(s.date) + ' · ' + label + '"></span>';
      }).join('') + '</span>';
    }).join('');
    var segLabels = mods.length > 1 ? '<div class="seg-labels" aria-hidden="true">' + mods.map(function (m) {
      return '<span style="--k:' + sessionsOfModule(m).length + '">' + modShort(m) + '</span>';
    }).join('') + '</div>' : '';

    var band = '<header class="band"><div class="wrap band-inner">' +
      '<div class="logos">' + logos() + '</div>' +
      '<p class="eyebrow">Дневник рефлексии</p>' +
      '<h1 class="greet">' + greeting() + (name ? ', ' + esc(name) : '') + '</h1>' +
      '<p class="program">' + esc(p.title || '') + (p.cohort ? ' · ' + esc(p.cohort) : '') + '</p>' +
      '<div class="progress">' +
        '<div class="progress-num"><span class="big">' + dc + '</span><span class="of">из ' + n + ' ' + plural(n, 'занятия', 'занятий', 'занятий') + '<br>с записанной рефлексией</span></div>' +
        '<div class="segs" role="img" aria-label="Рефлексия записана для ' + dc + ' из ' + n + ' занятий">' + segs + '</div>' + segLabels +
      '</div>' +
      '</div></header>';

    return band + '<main class="wrap home-main">' + focusCard() + insightsSection() + actionsSection() + archiveSection() + footer() + '</main>';
  }

  function focusCard() {
    var f = focusSession();
    if (!f.s) return '';
    var s = f.s, eyebrow, body = '';
    var mod = moduleOf(s);
    var head = function (eb) {
      return '<div class="focus-top"><span class="eyebrow accent">' + eb + '</span><span class="chip">' + (mod ? modChip(mod) : 'Занятие ' + numberOf(s)) + '</span></div>' +
        '<h2 class="focus-title">' + esc(s.title) + '</h2>' +
        '<p class="focus-meta">' + metaLine(s) + '</p>';
    };
    if (f.kind === 'today') {
      eyebrow = 'Сегодня · ' + fmtLong(s.date);
      body = '<div class="focus-actions"><button class="btn" data-act="start" data-id="' + s.id + '">Записать рефлексию</button>' +
        '<p class="focus-note">Три вопроса, около пяти минут</p>' +
        (f.also && f.also.length ? '<p class="focus-also">Сегодня ещё: ' + f.also.map(function (x) {
          return '<button data-act="start" data-id="' + x.id + '">' + esc(x.title) + '</button>';
        }).join(', ') + '</p>' : '') +
        '</div>';
    } else if (f.kind === 'today-done') {
      eyebrow = 'Сегодня · ' + fmtLong(s.date);
      body = '<p class="focus-done">' + ICON.check + 'Рефлексия записана</p>' +
        '<div class="focus-actions"><button class="btn ghost" data-act="open" data-id="' + s.id + '">Открыть запись</button></div>';
    } else if (f.kind === 'missed') {
      eyebrow = 'Ещё не записано · ' + fmtLong(s.date);
      body = '<div class="focus-actions"><button class="btn" data-act="start" data-id="' + s.id + '">Записать рефлексию</button>' +
        '<p class="focus-note">Лучше записать, пока свежо в памяти</p></div>';
    } else if (f.kind === 'next') {
      eyebrow = 'Следующее занятие · ' + fmtLong(s.date);
      body = '<div class="focus-actions"><button class="btn" disabled>Откроется в день занятия</button></div>';
    } else {
      return '<section class="card focus"><span class="eyebrow accent">Программа завершена</span>' +
        '<h2 class="focus-title">Вы прошли все ' + sessions().length + ' ' + plural(sessions().length, 'занятие', 'занятия', 'занятий') + '</h2>' +
        '<p class="focus-meta">Рефлексия записана для ' + doneCount() + ' из них. Копилка инсайтов остаётся с вами.</p></section>';
    }
    return '<section class="card focus" aria-label="Текущее занятие">' + head(eyebrow) + body + '</section>';
  }

  function insightsSection() {
    var all = allInsights();
    var head = '<div class="section-head"><h2>Копилка инсайтов</h2>' +
      (all.length ? '<button class="link" data-act="go" data-screen="insights">Все · ' + all.length + '</button>' : '') + '</div>';
    if (!all.length) {
      return '<section class="section">' + head + '<div class="card"><p class="empty">Здесь появятся идеи из ваших рефлексий. Первая карточка ляжет сюда после ближайшего занятия.</p></div></section>';
    }
    return '<section class="section">' + head + '<ul class="card list">' +
      all.slice(0, 3).map(function (it) { return insightItem(it, true); }).join('') + '</ul></section>';
  }

  function actionsSection() {
    var all = allActions();
    var done = all.filter(function (x) { return x.a.done; }).length;
    var head = '<div class="section-head"><h2>Что я делаю иначе</h2>' +
      (all.length ? '<span class="count">' + done + ' из ' + all.length + ' сделано</span>' : '') + '</div>';
    if (!all.length) {
      return '<section class="section">' + head + '<div class="card"><p class="empty">Ответы на вопрос «Что я буду делать иначе?» превратятся здесь в список дел, которые можно отмечать.</p></div></section>';
    }
    var pending = all.filter(function (x) { return !x.a.done; });
    var list = pending.length
      ? '<ul class="card list">' + pending.slice(0, 4).map(function (x) { return checkItem(x.s, x.a, x.i, true); }).join('') + '</ul>'
      : '<div class="card"><p class="empty">Все обещания себе выполнены. Новые появятся после следующей рефлексии.</p></div>';
    return '<section class="section">' + head + list +
      '<button class="link block" data-act="go" data-screen="actions">Все действия</button></section>';
  }

  function archiveRow(s) {
    var st = statusOf(s);
    var pill = { done: 'Записано', today: 'Сегодня', missed: 'Дописать', future: 'Скоро' }[st];
    var dis = st === 'future' ? ' disabled aria-disabled="true"' : '';
    return '<li><button class="row" data-act="open" data-id="' + s.id + '"' + dis + '>' +
      '<span class="date"><b>' + parseISO(s.date).getDate() + '</b><small>' + fmtMon(s.date) + '</small></span>' +
      '<span class="row-main"><span class="row-title">' + esc(s.title) + '</span><span class="row-sub">' + [modeLabel(s), s.speaker].filter(Boolean).map(esc).join(' · ') + '</span></span>' +
      '<span class="pill ' + st + '">' + pill + '</span></button></li>';
  }

  function archiveSection() {
    var ss = sessions();
    var f = focusSession();
    var cur = f.s ? f.s.module : null;
    var chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
    var blocks = modules().map(function (m) {
      var ms = sessionsOfModule(m);
      if (!ms.length) return '';
      var dn = ms.filter(function (s) { return hasEntry(s.id); }).length;
      var key = String(m.number);
      var isCur = !m.all && m.number === cur;
      var open = S.modOpen.hasOwnProperty(key) ? S.modOpen[key] : (m.all || isCur);
      var off = ms.filter(function (s) { return s.mode === 'offline'; });
      var note = off.length ? '<p class="mod-note">Очный период: ' + periodText(off[0].date, off[off.length - 1].date) + '</p>' : '';
      return '<details class="card mod' + (isCur ? ' current' : '') + '" data-mod="' + key + '"' + (open ? ' open' : '') + '>' +
        '<summary><span class="mod-num">' + (m.all ? ms.length : modBadge(m)) + '</span>' +
        '<span class="mod-main"><span class="mod-title">' + esc(m.title) + '</span>' +
        '<span class="mod-sub">' + periodText(ms[0].date, ms[ms.length - 1].date) + ' · записано ' + dn + ' из ' + ms.length + '</span></span>' +
        chev + '</summary>' + note +
        '<ul class="list archive">' + ms.map(archiveRow).join('') + '</ul></details>';
    }).join('');
    return '<section class="section"><div class="section-head"><h2>Архив занятий</h2><span class="count">' +
      ss.length + ' ' + plural(ss.length, 'занятие', 'занятия', 'занятий') + '</span></div>' +
      '<div class="modules">' + blocks + '</div></section>';
  }

  function footer() {
    var where = {
      cloud: 'Записи хранятся в вашем аккаунте Telegram и видны только вам.',
      local: 'Сейчас записи сохраняются в этом браузере. В Telegram они будут храниться в вашем аккаунте и будут видны только вам.',
      memory: 'Записи не сохранятся после закрытия страницы: браузер не даёт доступа к хранилищу.'
    }[Store.mode];
    var demo = settings().demo_mode ? '<p>Демо-режим: записи-примеры загружены из data.json.</p>' : '';
    return '<footer class="foot"><p>' + where + '</p>' + demo + '</footer>';
  }

  function renderFlow() {
    var s = sessionById(S.params.id), qs = questions(), step = S.params.step, q = qs[step];
    var val = S.draft[q.id] || '';
    var last = step === qs.length - 1;

        '<div class="steps" aria-hidden="true">' + steps + '</div>' +
        '<p class="eyebrow">Вопрос ' + (step + 1) + ' из ' + qs.length + '</p>' +
        '<h1 class="q" id="q-title">' + esc(q.title) + '</h1>' +

        '<div class="ta-foot"><span id="ta-info"></span><span id="ta-count"></span></div>' +

      '<div class="bottombar"><div class="wrap">' +
        (step > 0 ? '<button class="btn quiet" data-act="prev">Назад</button>' : '') +

  function updateAnswerUI(ta) {
    var q = questions()[S.params.step];
    var v = ta.value;
    ta.style.height = 'auto';
    ta.style.height = Math.max(180, ta.scrollHeight + 2) + 'px';
    var info = document.getElementById('ta-info');
    var cnt = document.getElementById('ta-count');
    var btn = document.getElementById('next-btn');
    var last = S.params.step === questions().length - 1;
    if (q.type === 'list') {
      var n = toLines(v).length;
      if (q.id === 'insights') info.textContent = n ? n + ' ' + plural(n, 'идея попадёт', 'идеи попадут', 'идей попадут') + ' в копилку' : '';
      else info.textContent = n ? n + ' ' + plural(n, 'действие попадёт', 'действия попадут', 'действий попадут') + ' в список' : '';
    } else info.textContent = '';
    var left = maxLen() - v.length;
    cnt.textContent = left < 200 ? 'Осталось ' + left : '';
    cnt.className = left < 60 ? 'warn' : '';
    if (!last) btn.textContent = v.trim() ? 'Далее' : 'Пропустить';
  }

  function renderDone() {
    var s = sessionById(S.params.id), e = entryOf(s.id) || {};
    var ni = (e.insights || []).length, na = (e.actions || []).length, n = sessions().length;
    return '<div class="screen"><div class="wrap done-body">' +
      '<div class="done-mark">' + ICON.check + '</div>' +
      '<p class="eyebrow">Занятие ' + numberOf(s) + ' · ' + fmtLong(s.date) + '</p>' +
      '<h1 class="done-title">Рефлексия записана</h1>' +
      '<p class="done-sub">' + esc(s.title) + '</p>' +
      '<ul class="card done-stats">' +
        '<li><b>' + ni + '</b><span>' + plural(ni, 'идея', 'идеи', 'идей') + ' в копилке</span></li>' +
        '<li><b>' + na + '</b><span>' + plural(na, 'действие', 'действия', 'действий') + ' на завтра</span></li>' +
        '<li><b>' + doneCount() + '<small style="font-size:14px;font-weight:500"> / ' + n + '</small></b><span>занятий с рефлексией</span></li>' +
      '</ul>' +
      '<div class="done-actions"><button class="btn" data-act="home">На главную</button>' +
      '<button class="btn ghost" data-act="open" data-id="' + s.id + '">Посмотреть запись</button></div>' +
      '</div></div>';
  }

  function renderEntry() {
    var s = sessionById(S.params.id), e = entryOf(s.id) || {}, qs = questions();
    var good = (e.good || '').trim();
    var ins = e.insights || [], acts = e.actions || [];
    var qTitle = function (id, i) { var q = qs.filter(function (x) { return x.id === id; })[0]; return q ? q.title : ['Что хорошего произошло', 'Идеи', 'Действия'][i]; };
    return '<div class="screen">' + topbar('Занятие ' + numberOf(s), 'Запись', '') +
      '<div class="wrap page">' +
        '<div class="entry-head">' +
          '<p class="eyebrow">' + fmtLong(s.date) + '</p>' +
          '<h1 class="entry-title">' + esc(s.title) + '</h1>' +
          '<p class="meta">' + metaLine(s) + '</p>' +
          (S.demo[s.id] ? '<span class="chip warm">Пример из data.json</span>' : '') +
        '</div>' +
        '<section class="card qa"><h2 class="qa-q">' + esc(qTitle('good', 0)) + '</h2>' +
          (good ? '<p class="qa-a">' + esc(good) + '</p>' : '<p class="empty" style="padding:0">Без ответа</p>') + '</section>' +
        '<section class="card qa"><h2 class="qa-q">' + esc(qTitle('insights', 1)) + '</h2>' +
          (ins.length ? '<ul class="bul">' + ins.map(function (t) { return '<li><span class="dot" aria-hidden="true"></span><span>' + esc(t) + '</span></li>'; }).join('') + '</ul>' : '<p class="empty" style="padding:0">Без ответа</p>') + '</section>' +
        '<section class="card qa"><h2 class="qa-q">' + esc(qTitle('actions', 2)) + '</h2>' +
          (acts.length ? '<ul class="checks">' + acts.map(function (a, i) { return checkItem(s, a, i, false); }).join('') + '</ul>' : '<p class="empty" style="padding:0">Без ответа</p>') + '</section>' +
        '<button class="btn ghost" data-act="edit" data-id="' + s.id + '">Изменить запись</button>' +
        (e.updated_at ? '<p class="meta center">Обновлено ' + esc(fmtStamp(e.updated_at)) + '</p>' : '') +
      '</div></div>';
  }

  function renderInsights() {
    var groups = sessions().slice().reverse().filter(function (s) { return hasEntry(s.id) && (entryOf(s.id).insights || []).length; });
    var total = allInsights().length;
    return '<div class="screen">' + topbar(total + ' ' + plural(total, 'идея', 'идеи', 'идей'), 'Копилка инсайтов', '') +
      '<div class="wrap page">' +
      (groups.length ? groups.map(function (s) {
        return '<section class="group"><div class="group-head"><b>' + esc(s.title) + '</b><small>Занятие ' + numberOf(s) + ' · ' + fmtLong(s.date) + '</small></div>' +
          '<ul class="card list">' + entryOf(s.id).insights.map(function (t) { return insightItem({ text: t, s: s }, false); }).join('') + '</ul></section>';
      }).join('') : '<div class="card"><p class="empty">Пока пусто. Идеи появятся после первой рефлексии.</p></div>') +
      '</div></div>';
  }

  function renderActions() {
    var all = allActions();
    var pending = all.filter(function (x) { return !x.a.done; });
    var done = all.filter(function (x) { return x.a.done; });
    var block = function (title, arr, emptyText) {
      return '<section class="group"><div class="group-head"><b>' + title + ' · ' + arr.length + '</b></div>' +
        (arr.length ? '<ul class="card list">' + arr.map(function (x) { return checkItem(x.s, x.a, x.i, true); }).join('') + '</ul>'
          : '<div class="card"><p class="empty">' + emptyText + '</p></div>') + '</section>';
    };
    return '<div class="screen">' + topbar(done.length + ' из ' + all.length + ' сделано', 'Что я делаю иначе', '') +
      '<div class="wrap page">' +
      block('В работе', pending, 'Всё выполнено.') +
      block('Сделано', done, 'Отмечайте выполненное, и оно появится здесь.') +
      '</div></div>';
  }

  function renderLoading() {
    document.body.classList.remove('on-home');
    app.innerHTML = '<div class="screen"><div class="wrap state-body">' +
      '<div class="state-logos">' + logos() + '</div>' +
      '<div class="spinner" aria-hidden="true"></div><p>Загружаем программу</p></div></div>';
  }

  function renderError() {
    document.body.classList.remove('on-home');
    var local = location.protocol === 'file:';
    app.innerHTML = '<div class="screen"><div class="wrap state-body">' +
      '<div class="state-logos">' + logos() + '</div>' +
      '<h1>Не удалось загрузить программу</h1>' +
      '<p>Проверьте подключение к интернету и попробуйте ещё раз. Если не поможет, напишите куратору программы.</p>' +
      (local ? '<p class="note">Страница открыта как файл с компьютера. В таком режиме браузер не даёт прочитать data.json. Откройте её через хостинг или локальный сервер.</p>' : '') +
      '<button class="btn" data-act="retry" style="max-width:320px">Попробовать ещё раз</button>' +
      '</div></div>';
  }

  /* ---------- render & navigation ---------- */
  function render() {
    var map = { home: renderHome, flow: renderFlow, done: renderDone, entry: renderEntry, insights: renderInsights, actions: renderActions };
    app.innerHTML = (map[S.screen] || renderHome)();
    document.body.classList.toggle('on-home', S.screen === 'home');
    if (S.screen === 'flow') {
      var ta = document.getElementById('answer');
      if (ta) {
        updateAnswerUI(ta);
        try { ta.focus({ preventScroll: true }); var l = ta.value.length; ta.setSelectionRange(l, l); } catch (e) {}
      }
    }
    syncTelegramChrome();
  }

  function syncTelegramChrome() {
    if (!inTg) return;
    try { if (tgv('6.1')) { if (S.screen === 'home') tg.BackButton.hide(); else tg.BackButton.show(); } } catch (e) {}
    try { if (tgv('6.2')) { if (S.screen === 'flow') tg.enableClosingConfirmation(); else tg.disableClosingConfirmation(); } } catch (e) {}
    try { if (tgv('7.7')) { if (S.screen === 'flow') tg.disableVerticalSwipes(); else tg.enableVerticalSwipes(); } } catch (e) {}
  }

  function go(screen, params, opts) {
    opts = opts || {};
    if (S.screen === 'home') S.homeScroll = window.scrollY;
    if (screen === 'home') S.history = [];
    else if (!opts.replace) S.history.push({ screen: S.screen, params: S.params });
    S.screen = screen;
    S.params = params || {};
    render();
    window.scrollTo(0, screen === 'home' ? (S.homeScroll || 0) : 0);
  }

  function back() {
    if (S.screen === 'flow' && S.params.step > 0) { keepDraft(); S.params.step--; render(); window.scrollTo(0, 0); return; }
    var prev = S.history.pop();
    if (!prev || prev.screen === 'loading') prev = { screen: 'home', params: {} };
    S.screen = prev.screen;
    S.params = prev.params;
    render();
    window.scrollTo(0, S.screen === 'home' ? (S.homeScroll || 0) : 0);
  }
  if (tgv('6.1')) { try { tg.BackButton.onClick(back); } catch (e) {} }

  /* ---------- reflection flow ---------- */
  function startFlow(id) {
    var e = entryOf(id);
    S.draft = {
      good: e ? (e.good || '') : '',
      insights: e ? (e.insights || []).join('\n') : '',
      actions: e ? (e.actions || []).map(function (a) { return a.text; }).join('\n') : ''
    };
    haptic('light');
    go('flow', { id: id, step: 0 });
  }

  function keepDraft() {
    var ta = document.getElementById('answer');
    if (ta && S.draft) S.draft[questions()[S.params.step].id] = ta.value;
  }

  function nextStep() {
    keepDraft();
    if (S.params.step < questions().length - 1) {
      S.params.step++;
      haptic('select');
      render();
      window.scrollTo(0, 0);
      return;
    }
    saveFlow();
  }

  function saveFlow() {
    var id = S.params.id, prev = entryOf(id) || {};
    var good = (S.draft.good || '').trim();
    var insights = toLines(S.draft.insights);
    var prevDone = {};
    (prev.actions || []).forEach(function (a) { prevDone[a.text] = !!a.done; });
    var actions = toLines(S.draft.actions).map(function (t) { return { text: t, done: !!prevDone[t] }; });
    if (!good && !insights.length && !actions.length) {
      haptic('warning');
      toast('Ответьте хотя бы на один вопрос');
      return;
    }
    var entry = { session_id: id, updated_at: new Date().toISOString(), good: good, insights: insights, actions: actions };
    var btn = document.getElementById('next-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Сохраняем'; }
    persist(entry).then(function (ok) {
      haptic(ok ? 'success' : 'warning');
      S.draft = null;
      go('done', { id: id }, { replace: true });
    });
  }

  function persist(entry) {
    S.entries[entry.session_id] = entry;
    delete S.demo[entry.session_id];
    return Store.save(entry).then(function () { return true; }, function () {
      if (Store.mode === 'cloud') {
        Store.mode = 'local';
        return Store.save(entry).then(function () {
          toast('Telegram не ответил. Запись сохранена на этом устройстве');
          return false;
        }, function () { toast('Не удалось сохранить запись. Проверьте соединение'); return false; });
      }
      toast('Не удалось сохранить запись. Проверьте соединение');
      return false;
    });
  }

  function toggleAction(id, idx) {
    var e = entryOf(id);
    if (!e || !e.actions || !e.actions[idx]) return;
    var copy = JSON.parse(JSON.stringify(e));
    copy.actions[idx].done = !copy.actions[idx].done;
    copy.updated_at = new Date().toISOString();
    haptic(copy.actions[idx].done ? 'success' : 'select');
    var y = window.scrollY;
    persist(copy);
    render();
    window.scrollTo(0, y);
  }

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.hidden = false;
    requestAnimationFrame(function () { t.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      t.classList.remove('show');
      setTimeout(function () { t.hidden = true; }, 250);
    }, 2600);
  }

  /* ---------- events ---------- */
  app.addEventListener('click', function (ev) {
    var sum = ev.target.closest('summary');
    if (sum && sum.parentElement && sum.parentElement.classList.contains('mod')) {
      S.modOpen[sum.parentElement.getAttribute('data-mod')] = !sum.parentElement.open;
      haptic('select');
      return;
    }
    var b = ev.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if (act === 'start' || act === 'edit') startFlow(id);
    else if (act === 'open') {
      var s = sessionById(id);
      if (!s) return;
      if (hasEntry(id)) { haptic('light'); go('entry', { id: id }); }
      else if (statusOf(s) !== 'future') startFlow(id);
    }
    else if (act === 'go') { haptic('light'); go(b.getAttribute('data-screen'), {}); }
    else if (act === 'toggle') toggleAction(id, +b.getAttribute('data-idx'));
    else if (act === 'next') nextStep();
    else if (act === 'prev' || act === 'back') back();
    else if (act === 'home') go('home', {});
    else if (act === 'retry') boot();
  });
  app.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'answer') {
      if (S.draft) S.draft[questions()[S.params.step].id] = ev.target.value;
      updateAnswerUI(ev.target);
    }
  });

  /* ---------- boot ---------- */
  function validData(d) {
    return d && Array.isArray(d.sessions) && d.sessions.length > 1 && Array.isArray(d.questions) && d.questions.length >= 1;
  }

  function boot() {
    renderLoading();
    Store.init();
    fetch('data.json?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (json) {
        if (!validData(json)) throw new Error('bad data');
        json.sessions.sort(function (a, b) {
          if (a.date !== b.date) return a.date < b.date ? -1 : 1;
          return (a.number || 0) - (b.number || 0);
        });
        S.data = json;
        return Store.loadAll();
      })
      .then(function (stored) {
        S.entries = {};
        S.demo = {};
        if (settings().demo_mode && Array.isArray(S.data.demo_reflections)) {
          S.data.demo_reflections.forEach(function (r) {
            if (r && r.session_id && sessionById(r.session_id)) {
              S.entries[r.session_id] = JSON.parse(JSON.stringify(r));
              S.demo[r.session_id] = true;
            }
          });
        }
        Object.keys(stored || {}).forEach(function (k) { S.entries[k] = stored[k]; delete S.demo[k]; });
        S.screen = 'loading';
        S.history = [];
        go('home', {});
      })
      .catch(function () { renderError(); });
  }

  boot();
})();
</script>
</body>
</html>
